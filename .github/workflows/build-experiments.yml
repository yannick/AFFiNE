name: Build Experiments Container

on:
  workflow_dispatch:
  push:
    branches:
      - experiments
    paths-ignore:
      - README.md

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/affine

jobs:
  build-web:
    name: Build Web & Admin & Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
      - name: Set version
        run: ./scripts/set-version.sh "0.0.0-dev.$(git rev-parse --short HEAD)"
      - name: Build Web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: canary
      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: canary
      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: canary
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build Server Native (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Set version
        run: ./scripts/set-version.sh "0.0.0-dev.$(git rev-parse --short HEAD)"
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'
      - name: Upload server-native
        uses: actions/upload-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native/server-native.node
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: build-server-native
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env
      - name: Set version
        run: ./scripts/set-version.sh "0.0.0-dev.$(git rev-parse --short HEAD)"
      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native
          path: ./packages/backend/native
      - name: Prepare native binaries for bundling
        run: |
          cd ./packages/backend/native
          # The real binary is server-native.node (no arch suffix).
          # Rspack resolves ALL require() paths in index.js during bundling,
          # including the arch-specific fallbacks. We must provide files for
          # each name so rspack can emit them.
          #
          # CRITICAL: copy (not touch!) the real binary as server-native.x64.node
          # because docker-clean.mjs deletes server-native.node and keeps only
          # the arch-specific file matching the container platform.
          cp server-native.node server-native.x64.node
          touch server-native.arm64.node
          touch server-native.armv7.node
          ls -la
      - name: Build Server
        run: yarn workspace @affine/server build
      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - build-web
      - build-server
    steps:
      - uses: actions/checkout@v6

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@toeverything'

      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server
        run: mv ./node_modules ./packages/backend/server

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          file: .github/deployment/node/Dockerfile
          tags: |
            ${{ env.IMAGE }}:experiments
            ${{ env.IMAGE }}:experiments-${{ github.sha }}
